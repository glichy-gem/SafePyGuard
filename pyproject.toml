[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "safepyguard"
dynamic = ["version"]
description = "Scan Python dependencies for license policy violations and known vulnerabilities in one CI-gatable report"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shivam Yadav" }]
keywords = ["license", "compliance", "security", "vulnerability", "osv", "sca", "ci", "spdx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "packaging>=23.0",
    "platformdirs>=3.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3",
]

[project.scripts]
safepyguard = "safepyguard.cli:main"

[tool.hatch.version]
path = "src/safepyguard/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests import the shared helpers in tests/fakes.py
addopts = "-m 'not network' --cov=safepyguard --cov-report=term-missing"
markers = ["network: calls the real PyPI and OSV APIs (run with: pytest -m network)"]

[tool.coverage.run]
source = ["safepyguard"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF022"]

[tool.mypy]
strict = true
files = ["src"]
