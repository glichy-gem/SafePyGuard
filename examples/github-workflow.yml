# Example: copy to .github/workflows/dependency-check.yml in your own repository.
name: Dependency check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write  # needed to upload SARIF

jobs:
  safepyguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the job when the policy is violated.
      - uses: glichy-gem/SafePyGuard@v0.1.0
        with:
          requirements: requirements.txt
          fail-on-severity: high

      # Optional: show findings in the repository's Security tab.
      - uses: glichy-gem/SafePyGuard@v0.1.0
        if: always()
        continue-on-error: true
        with:
          format: sarif
          output: safepyguard.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: safepyguard.sarif
